[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-autobench"
version = "1.0.1"
description = "Autonomous Pre-Silicon Hardware Verification & Tape-Out Audit Suite"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "DeepMind & Engineering Squad" }
]
keywords = ["semiconductor", "verilog", "systemverilog", "formal-verification", "eda", "sva", "icarus", "verilator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]

[project.scripts]
rtl-autobench = "autoverif.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoverif*"]
